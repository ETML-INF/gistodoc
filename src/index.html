<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Stories to Document</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid #21262d;
        background: #161b22;
        flex-shrink: 0;
        gap: 10px;
      }
      .header h1 {
        font-size: 15px;
        font-weight: 600;
        color: #f0f6fc;
        flex: 1;
      }

      /* ── Main content ── */
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 40px 20px;
        overflow-y: auto;
      }

      .idle-msg {
        font-size: 13px;
        color: #8b949e;
        text-align: center;
        max-width: 440px;
        line-height: 1.5;
      }

      /* ── Form ── */
      .form {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
      }

      .form input[type="text"],
      .form input[type="password"] {
        width: 100%;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #c9d1d9;
        padding: 9px 12px;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        margin-bottom: 10px;
      }
      .form input:focus {
        border-color: #388bfd;
        box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.12);
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .btn-export {
        flex: 1;
        background: #238636;
        color: #fff;
        border: 1px solid rgba(240, 246, 252, 0.1);
        border-radius: 6px;
        padding: 8px 20px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-export:hover {
        background: #2ea043;
      }
      .btn-export:disabled {
        background: #21262d;
        color: #484f58;
        cursor: default;
      }

      /* ── Status / feedback ── */
      .status-bar {
        width: 100%;
        max-width: 440px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 12px;
        color: #8b949e;
        min-height: 30px;
        word-break: break-all;
      }
      .status-bar:empty {
        display: none;
      }
      .status-bar.error {
        color: #ffa198;
        background: rgba(248, 81, 73, 0.15);
        border-radius: 6px;
        font-weight: 600;
      }
      .status-bar.success {
        color: #3fb950;
      }
      .status-bar.loading::before {
        content: "";
        flex-shrink: 0;
        width: 10px;
        height: 10px;
        border: 2px solid #388bfd;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Git Stories to Document</h1>
    </div>

    <div class="content">
      <div class="form">
        <input type="text" id="urlInput" placeholder="URL du dépôt — https://github.com/OWNER/REPO" />
        <input
          type="password"
          id="patInput"
          placeholder="Personal Access Token (ghp_…)"
          onkeydown="if (event.key === 'Enter') runExport('docx');"
        />
        <div class="actions">
          <button class="btn-export" id="btnMd" onclick="runExport('md')">Markdown</button>
          <button class="btn-export" id="btnDocx" onclick="runExport('docx')">Word (.docx)</button>
        </div>
      </div>
      <div class="status-bar" id="statusBar"></div>
    </div>

    <script>
      (() => {
        "use strict";

        // ── Helpers ───────────────────────────────────────────────────────────
        function setStatus(msg, cls = "") {
          const el = document.getElementById("statusBar");
          el.textContent = msg;
          el.className = "status-bar" + (cls ? " " + cls : "");
        }

        function setButtonsDisabled(disabled) {
          document.getElementById("btnMd").disabled = disabled;
          document.getElementById("btnDocx").disabled = disabled;
        }

        // ── Export ────────────────────────────────────────────────────────────
        async function runExport(format) {
          const url = document.getElementById("urlInput").value.trim();
          const pat = document.getElementById("patInput").value.trim();
          if (!url) {
            document.getElementById("urlInput").focus();
            return;
          }
          if (!pat) {
            document.getElementById("patInput").focus();
            return;
          }
          localStorage.setItem("lastUrl", url);
          localStorage.setItem("lastPat", pat);

          setButtonsDisabled(true);
          setStatus("Chargement…", "loading");

          window.electronAPI.onProgress((msg) => setStatus(msg, "loading"));

          try {
            const result = await window.electronAPI.exportProject(url, pat, format);

            if (result.success) {
              setStatus(
                `✓ ${result.count} issue${result.count !== 1 ? "s" : ""} exportée${result.count !== 1 ? "s" : ""} → ${result.filePath}`,
                "success"
              );
            } else if (result.canceled) {
              setStatus("Export annulé.", "");
            } else {
              setStatus(`Erreur : ${result.error}`, "error");
            }
          } catch (err) {
            setStatus(`Erreur : ${err.message}`, "error");
          } finally {
            window.electronAPI.removeProgressListeners();
            setButtonsDisabled(false);
          }
        }

        // Expose to HTML attributes
        window.runExport = runExport;

        // ── Init ──────────────────────────────────────────────────────────────
        document.addEventListener("DOMContentLoaded", () => {
          document.getElementById("urlInput").value = localStorage.getItem("lastUrl") || "";
          document.getElementById("patInput").value = localStorage.getItem("lastPat") || "";
          document.getElementById("urlInput").focus();
        });
      })();
    </script>
  </body>
</html>
